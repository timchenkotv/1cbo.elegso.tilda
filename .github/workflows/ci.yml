name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, wlab-ci, onecbo-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify isolated site
        run: |
          node --version
          node --check scripts/mirror-site.mjs
          node --check scripts/finalize-site.mjs
          node --check scripts/audit-site.mjs
          node --check scripts/dev-server.mjs
          AUDIT_WRITE=0 node scripts/audit-site.mjs
